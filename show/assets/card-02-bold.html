<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>封面卡片 02 · 大数字</title>
<style>
@font-face{font-family:"Pinyon Script";src:url(../alphagtm/assets/fonts/pinyon-script.woff2) format("woff2");font-weight:400;font-display:block}
:root{
  --bg:#050507;--ink:#f7f6f2;--ink2:#c9c7c0;--muted:#8e8d9c;
  --red:#D41432;--gold:#C9A96E;--line:rgba(201,169,110,.22);
  --display:"Bodoni 72","Bodoni 72 OS",Didot,"Songti SC",serif;
  --sans:"Montserrat","PingFang SC",system-ui,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:900px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1600px;height:900px;display:grid;grid-template-columns:1.25fr 1fr}
/* 左：黑底大数字 */
.left{position:relative;padding:76px 80px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.left::after{content:"";position:absolute;left:0;bottom:0;width:420px;height:3px;background:linear-gradient(90deg,var(--red),transparent)}
.kick{font:500 12px/1 var(--mono);letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.bignums{display:flex;flex-direction:column;gap:6px;margin-top:26px}
.bn{display:flex;align-items:baseline;gap:22px}
.bn .v{font-family:var(--display);font-size:130px;line-height:1;color:var(--ink);letter-spacing:-.02em}
.bn .v r{color:var(--red)}
.bn .l{font-size:26px;color:var(--ink2);letter-spacing:.06em}
.title2{margin-top:18px;font-family:var(--display);font-size:40px;line-height:1.3;color:var(--ink)}
.title2 em{font-style:normal;color:var(--gold)}
.foot{font:400 13px/1.7 var(--mono);color:var(--muted);letter-spacing:.1em}
.foot b{color:var(--ink);font-weight:600}
/* 右：红色块 + 花体方案名 */
.right{position:relative;background:var(--red);padding:76px 66px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.right::before{content:"";position:absolute;right:-180px;top:-180px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 66%)}
.logo{height:30px;filter:brightness(0) invert(1);opacity:.92}
.right .script{font-family:"Pinyon Script",cursive;color:#fff;font-size:126px;line-height:.9;transform:skewX(-8deg);transform-origin:0 70%}
.right .cn{font-family:var(--display);font-size:46px;color:#fff;letter-spacing:.16em;margin-top:8px}
.right .sol{font-family:var(--display);font-size:34px;line-height:1.4;color:#fff;margin-top:36px}
.right .sol span{color:rgba(255,255,255,.75)}
.right .tag{font:500 12px/1 var(--mono);letter-spacing:.26em;color:rgba(255,255,255,.85);text-transform:uppercase}
</style>
</head>
<body>
<div class="stage">
  <div class="left">
    <div>
      <div class="kick">INTERCITY HACK 湖州 · AI + GTM</div>
      <div class="bignums">
        <div class="bn"><span class="v">1<r>人</r></span><span class="l">运营 30 国账号</span></div>
        <div class="bn"><span class="v">5</span><span class="l">个 BOT 专家</span></div>
        <div class="bn"><span class="v">1→30</span><span class="l">中文原片裂变多语成片</span></div>
      </div>
      <div class="title2">给中国工厂的 <em>AI 出海改造</em></div>
    </div>
    <div class="foot">参赛团队 <b>AlphaGTM</b> · 命题企业 <b>浙江冠英</b><br>alphagtm.pages.dev · 2026.11</div>
  </div>
  <div class="right">
    <img class="logo" src="../alphagtm/assets/alphafde-gradient-logo.png" alt="AlphaFDE">
    <div>
      <div class="script">Alpha GTM</div>
      <div class="cn">阿尔法营销</div>
      <div class="sol">湖州冠英FDE解决方案<br><span>+ 出海GTM Harness</span></div>
    </div>
    <div class="tag">SCAN · VIEW · EXPERIENCE</div>
  </div>
</div>
</body>
</html>
